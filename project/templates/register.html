{% extends "base.html" %}

{% block title %}ProHealth - Caregiver Registration{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 480px;">
    <div class="form-card" style="padding: 40px 30px;">
        <div class="form-section-title" style="justify-content: center; margin-bottom: 6px;">
            <span>🩺</span> Caregiver Registry
        </div>
        <p class="form-section-desc" style="text-align: center; margin-bottom: 30px;">
            Register a new secure caregiver profile.
        </p>
        
        {% if error %}
            <div style="background-color: rgba(239, 68, 68, 0.12); color: #991B1B; padding: 12px; border-radius: var(--radius-small); margin-bottom: 20px; font-size: 0.9rem; border: 1px solid rgba(239, 68, 68, 0.2); font-weight: 500; text-align: center;">
                ⚠️ {{ error }}
            </div>
        {% endif %}
        
        <form action="/register" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-input" required placeholder="Sarah Jenkins">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" required placeholder="parent@prohealth.com">
            </div>
            
            <div class="form-group" style="margin-bottom: 24px;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="submit-btn" style="margin-bottom: 20px;">Create Account</button>
        </form>
        
        <p style="text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            Already registered? <a href="/login" style="font-weight: 600;">Sign in here</a>
        </p>
    </div>
</div>
{% endblock %}
